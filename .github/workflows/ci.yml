name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regressions:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python syntax
        run: python -I -B -m py_compile router.py audit_platform.py test_regressions.py
      - name: Run offline regressions
        run: python -I -B test_regressions.py
      - name: Check whitespace
        run: git diff --check
